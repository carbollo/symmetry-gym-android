</div>

</div>
</div>
</div>

<!-- Finalize Button -->
<div class="fixed bottom-0 w-full p-container-margin bg-gradient-to-t from-background via-background to-transparent pt-10">
<button class="w-full py-5 bg-secondary text-white font-headline-md text-xl italic uppercase rounded-xl glow-magenta active:scale-95 transition-all flex items-center justify-center gap-3">
<span>FINALIZAR ENTRENO</span>
<span class="material-symbols-outlined" data-icon="bolt" style="font-variation-settings: 'FILL' 1;">bolt</span>
</button>
</div>
<!-- Micro-interaction Script -->
<script>
        // Simple ripple-like effect on inputs or specialized confirms
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                // Potential focus logic or animation triggers
            });
        });

        // Toggle logic for segmented control
        const segments = document.querySelectorAll('.bg-surface-container-lowest button');
        segments.forEach(btn => {
            btn.addEventListener('click', () => {
                segments.forEach(b => {
                    b.classList.remove('bg-surface-container-highest', 'text-white', 'shadow-sm');
                    b.classList.add('text-on-surface-variant');
                });
                btn.classList.add('bg-surface-container-highest', 'text-white', 'shadow-sm');
                btn.classList.remove('text-on-surface-variant');
            });
        });
    </script>
</body></html>
