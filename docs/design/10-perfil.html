<style>
        body {
            background-color: #0B0B10;
            color: #e4e1e9;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(19, 19, 24, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid #1A1A24;
        }
        .chip-active {
            background-color: #6d5dfb;
            color: white;
            border-color: transparent;
        }
        .chip-inactive {
            background-color: #1A1A24;
            color: #928ea1;
            border: 1px solid #1A1A24;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0B0B10; }
        ::-webkit-scrollbar-thumb { background: #1A1A24; border-radius: 10px; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="font-body-md overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline-variant transition-colors duration-200 flex items-center px-gutter h-16 w-full">
<div class="flex items-center gap-4">
<button class="hover:bg-surface-variant dark:hover:bg-surface-variant p-2 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined text-primary dark:text-primary" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary">Perfil</h1>
</div>
</header>
<main class="pt-24 pb-32 px-container-margin max-w-2xl mx-auto">
<!-- Profile Header Image/Identity -->
<div class="flex flex-col items-center mb-8">
<div class="relative group">
<div class="w-24 h-24 rounded-full border-2 border-primary-container overflow-hidden p-1">
<img class="w-full h-full object-cover rounded-full" data-alt="A professional studio portrait of a fit athlete in a high-tech obsidian gym environment, cinematic soft violet lighting, sharp focus, high-end athletic aesthetics, 8k resolution, minimalist black background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCyOXtbYFktpBVmffNFZK3jQxu4O7hoFOBkXAo4_q5PHvBaL90sLEAvxcesqhvyv17Vb5x16R_LOCFqGcY913Fc3rtnmp_gNYlNwSk9evqw9OxsC565fAgclN_4MjtG59CZvZKONmLWyuhXt3KMgMYV9I9iLOxwBNH4eu30PWn6cqp_U72CuL2GRUbpqgMxgOksZJDSoaIwvYWCwc2SryUS76wukKruupfy54UMDty08jCct0eewGAESnspxDCT-hhnuVq35aBJCgCD"/>
</div>
<div class="absolute bottom-0 right-0 bg-primary-container p-1 rounded-full border-2 border-surface flex items-center justify-center cursor-pointer">
<span class="material-symbols-outlined text-[16px] text-white">edit</span>
</div>
</div>
<h2 class="mt-4 font-headline-md text-headline-md">Atleta Symmetry</h2>
<p class="text-outline font-body-md">Miembro desde 2024</p>
</div>
<!-- Main Form Card -->
<div class="glass-card rounded-[24px] p-md space-y-md">
<!-- Nombre -->
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-outline">NOMBRE</label>
<input class="w-full bg-[#1A1A24] border border-[#1A1A24] rounded-xl px-4 py-3 text-on-surface focus:outline-none focus:border-primary-container transition-all font-body-md" placeholder="Escribe tu nombre" type="text" value="Atleta Symmetry"/>
</div>
<!-- Sexo -->
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-outline">SEXO</label>
<div class="flex gap-sm">
<button class="flex-1 py-3 px-4 rounded-xl font-label-bold text-label-bold transition-all chip-active">Hombre</button>
<button class="flex-1 py-3 px-4 rounded-xl font-label-bold text-label-bold transition-all chip-inactive hover:border-outline">Mujer</button>
<button class="flex-1 py-3 px-4 rounded-xl font-label-bold text-label-bold transition-all chip-inactive hover:border-outline">Otro</button>
</div>
</div>
<!-- Peso & Altura -->
<div class="grid grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-outline">PESO (KG)</label>
<input class="w-full bg-[#1A1A24] border border-[#1A1A24] rounded-xl px-4 py-3 text-on-surface focus:outline-none focus:border-primary-container transition-all font-body-md" type="number" value="75"/>
</div>
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-outline">ALTURA (CM)</label>
<input class="w-full bg-[#1A1A24] border border-[#1A1A24] rounded-xl px-4 py-3 text-on-surface focus:outline-none focus:border-primary-container transition-all font-body-md" type="number" value="180"/>
</div>
</div>
<!-- Unidad de Peso -->
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-outline">UNIDAD DE PESO</label>
<div class="flex gap-sm w-1/2">
<button class="flex-1 py-3 px-4 rounded-xl font-label-bold text-label-bold transition-all chip-active">kg</button>
<button class="flex-1 py-3 px-4 rounded-xl font-label-bold text-label-bold transition-all chip-inactive hover:border-outline">lb</button>
</div>
</div>
<!-- Experiencia -->
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-outline">EXPERIENCIA</label>
<div class="flex flex-col md:flex-row gap-sm">
<button class="flex-1 py-3 px-4 rounded-xl font-label-bold text-label-bold transition-all chip-inactive hover:border-outline">Principiante</button>
<button class="flex-1 py-3 px-4 rounded-xl font-label-bold text-label-bold transition-all chip-active">Intermedio</button>
<button class="flex-1 py-3 px-4 rounded-xl font-label-bold text-label-bold transition-all chip-inactive hover:border-outline">Avanzado</button>
</div>
</div>
<!-- Note -->
<div class="pt-sm border-t border-[#1A1A24] flex items-start gap-2">
<span class="material-symbols-outlined text-[18px] text-outline">info</span>
<p class="text-[12px] text-outline leading-tight font-body-md">Tu peso corporal y sexo se usan para calcular tus rangos de fuerza.</p>
</div>
<!-- Save Button Inside Card -->
<div class="pt-md">
<button class="w-full bg-primary-container hover:bg-[#5a4ae0] text-white font-headline-md py-4 rounded-xl transition-all shadow-lg active:scale-[0.98]">
                    Guardar perfil
                </button>
</div>
</div>
<!-- Additional Settings Section -->
<div class="mt-lg space-y-md">
<h3 class="font-headline-md text-[18px] px-2">Ajustes de cuenta</h3>
<div class="glass-card rounded-2xl overflow-hidden">
<div class="flex items-center justify-between p-4 border-b border-[#1A1A24] hover:bg-surface-variant cursor-pointer transition-all">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline">notifications</span>
<span class="font-body-md">Notificaciones</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</div>
<div class="flex items-center justify-between p-4 border-b border-[#1A1A24] hover:bg-surface-variant cursor-pointer transition-all">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline">security</span>
<span class="font-body-md">Privacidad</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</div>
<div class="flex items-center justify-between p-4 text-error hover:bg-error/10 cursor-pointer transition-all">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined">logout</span>
<span class="font-body-md">Cerrar sesión</span>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface/40 dark:bg-surface/40 backdrop-blur-xl border-t border-outline-variant dark:border-outline-variant flex justify-around items-center px-4 py-2 pb-safe h-20">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-3 transition-all hover:text-primary" href="#">
<span class="material-symbols-outlined">home</span>
</a>
<!-- Workouts -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-3 transition-all hover:text-primary" href="#">
<span class="material-symbols-outlined">fitness_center</span>
</a>
<!-- Explore -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-3 transition-all hover:text-primary" href="#">
<span class="material-symbols-outlined">explore</span>
</a>
<!-- Body (Mapped as active based on 'Perfil' context) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full p-3 transition-transform scale-95 active:scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">accessibility_new</span>
</a>
<!-- Stats -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-3 transition-all hover:text-primary" href="#">
<span class="material-symbols-outlined">insights</span>
</a>
</nav>
<script>
        // Simple micro-interaction for chip selection
        document.querySelectorAll('.flex.gap-sm button, .flex.flex-col.md\\:flex-row.gap-sm button').forEach(button => {
            button.addEventListener('click', function() {
                const parent = this.parentElement;
                parent.querySelectorAll('button').forEach(btn => {
                    btn.classList.remove('chip-active');
                    btn.classList.add('chip-inactive');
                });
                this.classList.remove('chip-inactive');
                this.classList.add('chip-active');
            });
        });

        // Floating label effect or ripple could go here
    </script>
</body></html>
